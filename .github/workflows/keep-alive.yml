name: Keep Backend Alive

on:
  schedule:
    # Runs every 14 minutes to prevent Render from going to sleep (Render sleeps after 15 minutes of inactivity on the free tier)
    - cron: "*/14 * * * *"
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API Health Endpoint
        # Make sure this matches your actual Render API URL
        run: curl -s -f https://okkhata-api.onrender.com/api/health || echo "Ping failed, backend might be waking up."
